# MASTER PROJECT PROMPT – FINBRIDGE
## Premium Financial Marketplace & Personal Finance Dashboard

Act as a Senior FinTech Product Designer, UI/UX Engineer, Frontend Architect and JavaScript Developer.

Build a complete, premium, modern and fully interactive Indian financial marketplace website inspired by the functionality of Paisabazaar, but with original branding, original layouts and a unique FinBridge design identity.

IMPORTANT:
This is a frontend-only interactive demo. Use ONLY:
- HTML5
- CSS3
- Vanilla JavaScript
- Bootstrap 5
- Bootstrap Icons
- Chart.js
- Google Fonts

Do not use React, Next.js, Angular, Vue, Django, Flask, Node.js or any backend.

All pages must be connected and functional using JavaScript, localStorage and sample demo data.

