<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login to FinBridge — Customer & Admin Portal</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        
        <!-- Brand Logo -->
        <div class="text-center mb-4">
          <a class="fb-brand justify-content-center text-decoration-none" href="index.html">
            <div class="fb-brand-icon"><i class="bi bi-layers-half"></i></div>
            <span>Fin<span class="highlight">Bridge</span></span>
          </a>
          <p class="text-muted small mt-2">Your Money. Your Control. Your Future.</p>
        </div>

        <div class="card border shadow-sm p-4" style="border-radius:18px;">
          <h4 class="fw-bold text-navy mb-1">Welcome Back</h4>
          <p class="text-muted small mb-4">Log in to track loan applications and access your financial dashboard</p>

          <!-- 1-Click Demo Quickfill Buttons -->
          <div class="p-3 bg-light rounded-3 border mb-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="small fw-bold text-navy"><i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Access</span>
              <span class="badge bg-success-subtle text-success border border-success-subtle">1-Click</span>
            </div>
            <div class="row g-2">
              <div class="col-6">
                <button type="button" class="btn btn-sm btn-outline-primary w-100 fw-semibold" onclick="quickLoginCustomer()">
                  <i class="bi bi-person-fill"></i> Customer
                </button>
              </div>
              <div class="col-6">
                <button type="button" class="btn btn-sm btn-outline-dark w-100 fw-semibold" onclick="quickLoginAdmin()">
                  <i class="bi bi-shield-lock-fill"></i> Admin Portal
                </button>
              </div>
            </div>
          </div>

          <!-- Login Form -->
          <form onsubmit="handleStandardLogin(event)">
            <div class="mb-3">
              <label class="fb-form-label">Email or Mobile Number</label>
              <input type="text" class="fb-form-control" id="loginId" placeholder="aditya.sharma@example.com" value="aditya.sharma@example.com" required>
            </div>
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="fb-form-label mb-0">Password / OTP</label>
                <a href="javascript:void(0)" class="small text-muted" onclick="showToast('OTP sent to demo mobile: 89421', 'info')">Get OTP</a>
              </div>
              <input type="password" class="fb-form-control" id="loginPass" value="demo1234" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
              </div>
              <a href="javascript:void(0)" class="small text-primary" onclick="showToast('Password reset link simulated.', 'info')">Forgot password?</a>
            </div>

            <button type="submit" class="fb-btn-primary w-100 py-2 mb-3">
              Log In to Portal <i class="bi bi-box-arrow-in-right"></i>
            </button>
          </form>

          <div class="text-center small text-muted">
            Don't have an account yet? <a href="register.html" class="fw-bold text-success">Create Free Account</a>
          </div>
        </div>

        <div class="text-center mt-4 text-muted small">
          <a href="index.html" class="text-muted"><i class="bi bi-arrow-left me-1"></i> Back to FinBridge Home</a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function quickLoginCustomer() {
      const demoUser = {
        name: 'Aditya Sharma',
        email: 'aditya.sharma@example.com',
        phone: '+91 98765 43210',
        city: 'New Delhi',
        cibil: 785,
        income: 120000
      };
      localStorage.setItem('finbridge_user', JSON.stringify(demoUser));
      showToast('Logged in as Customer (Aditya Sharma)', 'success');
      setTimeout(() => { window.location.href = 'dashboard/index.html'; }, 600);
    }

    function quickLoginAdmin() {
      localStorage.setItem('finbridge_admin_auth', 'true');
      showToast('Authenticated as Administrator', 'success');
      setTimeout(() => { window.location.href = 'admin/index.html'; }, 600);
    }

    function handleStandardLogin(e) {
      e.preventDefault();
      quickLoginCustomer();
    }
  </script>
</body>
</html>
